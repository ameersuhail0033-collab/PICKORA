<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cart — Pickora</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" type="image/png" href="/assets/icons/favicon.png">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/main.css">
  <link rel="stylesheet" href="/css/cart.css">
  <script src="/js/env.js"></script>
  <script src="/js/config.js"></script>
</head>
<body>
  <header class="pk-header" id="navbar"></header>
  <main class="pk-cart-page">
    <div class="container">
      <div style="margin-bottom:8px;"><span class="pk-pill pk-pill-navy">CART</span></div>
      <h1 style="font-size:clamp(1.5rem,3vw,2rem);font-weight:800;color:var(--pk-navy);margin-bottom:24px;">Shopping Cart</h1>
      <div class="pk-cart-shell">
        <div class="pk-cart-layout" id="cart-layout">
          <div class="pk-cart-items" id="cart-items-list"></div>
          <div class="pk-cart-summary" id="cart-summary-card"></div>
        </div>
      </div>
    </div>
  </main>
  <footer id="footer"></footer>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/js/env.js"></script><script src="/js/config.js"></script><script src="/js/supabase.js"></script><script src="/js/settings.js"></script><script src="/js/components.js"></script><script src="/js/cart.js"></script>
</body>
</html>
