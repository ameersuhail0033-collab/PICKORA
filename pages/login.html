<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In — Pickora</title>
  <link rel="icon" type="image/svg+xml" href="/assets/icons/favicon.svg">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/main.css">
  <link rel="stylesheet" href="/css/auth.css">
  <script src="/js/env.js"></script>
  <script src="/js/config.js"></script>
</head>
<body>
  <div class="pk-auth-page">
    <div class="pk-auth-card">
      <div class="pk-auth-logo">
        <span class="pk-auth-logo-text">Pick<span>ora</span></span>
      </div>
      <h2>Welcome Back</h2>
      <p class="pk-auth-sub">Sign in to your account</p>

      <div class="pk-auth-error" id="login-error"></div>

      <button class="pk-auth-social-btn" id="google-signin">
        <svg width="18" height="18" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 0 1-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
        Continue with Google
      </button>

      <div class="pk-auth-divider">or</div>

      <form id="login-form">
        <div class="pk-input-group">
          <label class="pk-label">Email</label>
          <input type="email" class="pk-input" name="email" placeholder="you@example.com" required autocomplete="email">
        </div>
        <div class="pk-input-group">
          <label class="pk-label">Password</label>
          <input type="password" class="pk-input" name="password" placeholder="••••••••" required autocomplete="current-password">
        </div>
        <div style="display:flex;justify-content:flex-end;margin-bottom:20px;">
          <a href="/pages/forgot-password.html" style="font-size:0.85rem;color:var(--pk-violet);font-weight:500;">Forgot password?</a>
        </div>
        <button type="submit" class="pk-btn pk-btn-primary w-full">Sign In</button>
      </form>

      <button class="pk-btn pk-btn-ghost w-full" id="magic-link-btn" style="margin-top:10px;font-size:0.88rem;">
        ✨ Send Magic Link
      </button>

      <div class="pk-auth-link">
        Don't have an account? <a href="/pages/register.html">Create one</a>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/js/env.js"></script><script src="/js/config.js"></script><script src="/js/supabase.js"></script><script src="/js/settings.js"></script><script src="/js/components.js"></script><script src="/js/auth.js"></script>
</body>
</html>
