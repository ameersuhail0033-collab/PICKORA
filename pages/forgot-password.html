<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forgot Password — Pickora</title>
  <link rel="icon" type="image/svg+xml" href="/assets/icons/favicon.svg">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/main.css">
  <link rel="stylesheet" href="/css/auth.css">
  <script src="/js/env.js"></script>
  <script src="/js/config.js"></script>
</head>
<body>
  <div class="pk-auth-page">
    <div class="pk-auth-card">
      <div class="pk-auth-logo">
        <span class="pk-auth-logo-text">Pick<span>ora</span></span>
      </div>
      <h2>Forgot Password?</h2>
      <p class="pk-auth-sub">Enter your email and we'll send a reset link.</p>
      <div class="pk-auth-error" id="forgot-error"></div>
      <div class="pk-auth-error show" id="forgot-success" style="display:none;border-left-color:var(--pk-success);color:var(--pk-success);background:rgba(16,185,129,0.06);">
        ✅ Reset link sent! Check your inbox.
      </div>
      <form id="forgot-form">
        <div class="pk-input-group">
          <label class="pk-label">Email Address</label>
          <input type="email" class="pk-input" name="email" placeholder="you@example.com" required>
        </div>
        <button type="submit" class="pk-btn pk-btn-primary w-full">Send Reset Link</button>
      </form>
      <div class="pk-auth-link">Remember your password? <a href="/pages/login.html">Sign in</a></div>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/js/env.js"></script><script src="/js/config.js"></script><script src="/js/supabase.js"></script><script src="/js/settings.js"></script><script src="/js/components.js"></script><script src="/js/auth.js"></script>
</body>
</html>
