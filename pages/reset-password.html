<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password — Pickora</title>
  <link rel="icon" type="image/svg+xml" href="/assets/icons/favicon.svg">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/main.css">
  <link rel="stylesheet" href="/css/auth.css">
  <script src="/js/env.js"></script>
  <script src="/js/config.js"></script>
</head>
<body>
  <div class="pk-auth-page">
    <div class="pk-auth-card">
      <div class="pk-auth-logo"><span class="pk-auth-logo-text">Pick<span>ora</span></span></div>
      <h2>Reset Password</h2>
      <p class="pk-auth-sub">Enter your new password below.</p>
      <div class="pk-auth-error" id="reset-error"></div>
      <form id="reset-form">
        <div class="pk-input-group"><label class="pk-label">New Password</label><input type="password" class="pk-input" name="password" placeholder="Min. 8 characters" required minlength="8"></div>
        <div class="pk-input-group"><label class="pk-label">Confirm Password</label><input type="password" class="pk-input" name="confirm_password" placeholder="Repeat password" required></div>
        <button type="submit" class="pk-btn pk-btn-primary w-full">Update Password</button>
      </form>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/js/env.js"></script><script src="/js/config.js"></script><script src="/js/supabase.js"></script><script src="/js/settings.js"></script><script src="/js/components.js"></script><script src="/js/auth.js"></script>
</body>
</html>
