<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Products — Pickora Admin</title>
    <meta name="robots" content="noindex, nofollow">
    <link rel="icon" type="image/png" href="/assets/icons/favicon.png">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/admin.css">
    <style>
        /* ── Minimal products page ─────────────────────────────── */
        .page-head {
            display: flex; align-items: center; justify-content: space-between;
            gap: 16px; margin-bottom: 20px;
        }
        .page-head h1 {
            font-size: 18px; font-weight: 600; margin: 0; color: var(--admin-text);
            letter-spacing: -0.01em;
        }
        .page-head-sub {
            font-size: 12.5px; color: var(--admin-text-muted); margin-top: 3px;
        }

        .toolbar {
            display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
            margin-bottom: 14px;
        }
        .search {
            display: flex; align-items: center; gap: 8px;
            background: var(--admin-surface); border: 1px solid var(--admin-border);
            border-radius: 8px; padding: 7px 11px; flex: 0 1 260px;
        }
        .search i { color: var(--admin-text-muted); font-size: 12px; }
        .search input {
            background: none; border: none; color: var(--admin-text);
            font-size: 13px; outline: none; width: 100%;
        }
        .search input::placeholder { color: var(--admin-text-muted); }
        .select {
            background: var(--admin-surface); border: 1px solid var(--admin-border);
            border-radius: 8px; color: var(--admin-text); padding: 7px 10px;
            font-size: 13px; outline: none; cursor: pointer;
        }
        .select option { background: var(--admin-surface); color: var(--admin-text); }
        .spacer { flex: 1; }
        .btn-new {
            display: inline-flex; align-items: center; gap: 6px;
            background: var(--admin-secondary); color: #fff; border: none;
            border-radius: 8px; padding: 7px 14px; font-size: 13px;
            font-weight: 500; cursor: pointer; transition: background 0.15s;
        }
        .btn-new:hover { background: #7c3aed; }

        .count-row {
            font-size: 12px; color: var(--admin-text-muted); margin-bottom: 10px;
        }

        /* Minimal table */
        .table-wrap {
            background: var(--admin-surface); border: 1px solid var(--admin-border);
            border-radius: 10px; overflow-x: auto;
        }
        .tbl { width: 100%; border-collapse: collapse; }
        .tbl th {
            text-align: left; padding: 10px 14px; font-size: 11px; font-weight: 500;
            color: var(--admin-text-muted); text-transform: uppercase;
            letter-spacing: 0.06em; border-bottom: 1px solid var(--admin-border);
        }
        .tbl td {
            padding: 9px 14px; font-size: 13px; color: var(--admin-text-secondary);
            border-bottom: 1px solid var(--admin-border-light);
        }
        .tbl tbody tr:last-child td { border-bottom: none; }
        .tbl tbody tr:hover td { background: var(--admin-surface-hover); }
        .tbl .p-img {
            width: 34px; height: 34px; border-radius: 6px; object-fit: cover;
            background: var(--admin-surface-hover); display: block;
        }
        .tbl .p-name { color: var(--admin-text); font-weight: 500; }
        .tbl .p-sub { font-size: 11.5px; color: var(--admin-text-muted); margin-top: 1px; }
        .tbl .p-sku { font-size: 12px; color: var(--admin-text-muted); font-family: ui-monospace, monospace; }
        .tbl .p-price { color: var(--admin-text); font-weight: 500; font-variant-numeric: tabular-nums; }
        .tbl .p-stock { font-variant-numeric: tabular-nums; }
        .tbl .p-stock.low { color: var(--admin-negative); }
        .dot {
            display: inline-block; width: 6px; height: 6px; border-radius: 50%;
            margin-right: 6px; vertical-align: middle;
        }
        .dot.on { background: var(--admin-positive); }
        .dot.off { background: var(--admin-text-muted); }
        .row-actions { display: flex; gap: 2px; justify-content: flex-end; }
        .icon-btn {
            width: 28px; height: 28px; border-radius: 6px; border: none;
            background: transparent; color: var(--admin-text-muted); cursor: pointer;
            display: flex; align-items: center; justify-content: center; font-size: 12px;
            transition: all 0.12s;
        }
        .icon-btn:hover { background: var(--admin-surface-hover); color: var(--admin-text); }
        .icon-btn.danger:hover { color: var(--admin-negative); }

        /* Minimal pagination */
        .pager {
            display: flex; align-items: center; justify-content: center;
            gap: 4px; padding: 14px 0 4px;
        }
        .pg {
            min-width: 30px; height: 30px; padding: 0 8px; border-radius: 6px;
            border: 1px solid transparent; background: transparent;
            color: var(--admin-text-secondary); font-size: 12.5px; cursor: pointer;
            display: inline-flex; align-items: center; justify-content: center;
            transition: all 0.12s;
        }
        .pg:hover { background: var(--admin-surface-hover); color: var(--admin-text); }
        .pg.active { background: var(--admin-secondary); color: #fff; }
        .pg:disabled { opacity: 0.35; cursor: not-allowed; }
        .pg-dots { color: var(--admin-text-muted); padding: 0 2px; }

        .empty {
            text-align: center; padding: 40px 20px; color: var(--admin-text-muted); font-size: 13px;
        }
        .empty i { font-size: 32px; display: block; margin-bottom: 10px; opacity: 0.5; }

        /* Minimal modal */
        .modal-overlay {
            position: fixed; inset: 0; z-index: 9000;
            background: rgba(0,0,0,0.55); backdrop-filter: blur(3px);
            display: none; align-items: center; justify-content: center; padding: 24px;
        }
        .modal-overlay.active { display: flex; }
        .modal {
            background: var(--admin-surface); border: 1px solid var(--admin-border);
            border-radius: 12px; width: 100%; max-width: 640px; max-height: 90vh;
            overflow-y: auto;
        }
        .modal-head {
            display: flex; align-items: center; justify-content: space-between;
            padding: 16px 20px; border-bottom: 1px solid var(--admin-border);
        }
        .modal-head h3 { font-size: 15px; font-weight: 600; margin: 0; }
        .modal-x {
            width: 28px; height: 28px; border-radius: 6px; border: none;
            background: transparent; color: var(--admin-text-muted);
            cursor: pointer; font-size: 16px; display: flex;
            align-items: center; justify-content: center;
        }
        .modal-x:hover { color: var(--admin-text); background: var(--admin-surface-hover); }
        .modal-body { padding: 20px; }
        .fgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
        .fgroup { display: flex; flex-direction: column; gap: 5px; }
        .fgroup.full { grid-column: 1 / -1; }
        .flabel { font-size: 12px; font-weight: 500; color: var(--admin-text-secondary); }
        .fin, .fsel, .fta {
            background: var(--admin-bg); border: 1px solid var(--admin-border);
            border-radius: 8px; padding: 8px 11px; color: var(--admin-text);
            font-size: 13px; outline: none; transition: border-color 0.12s;
            font-family: inherit; width: 100%;
        }
        .fin:focus, .fsel:focus, .fta:focus { border-color: var(--admin-secondary); }
        .fta { resize: vertical; min-height: 70px; }
        .fcheck { display: flex; align-items: center; gap: 7px; font-size: 13px; color: var(--admin-text-secondary); cursor: pointer; }
        .fcheck input { accent-color: var(--admin-secondary); }
        .modal-foot {
            display: flex; justify-content: flex-end; gap: 8px;
            padding: 14px 20px; border-top: 1px solid var(--admin-border);
        }
        .btn-ghost {
            padding: 7px 14px; border-radius: 8px; border: 1px solid var(--admin-border);
            background: transparent; color: var(--admin-text-secondary); font-size: 13px;
            cursor: pointer;
        }
        .btn-ghost:hover { color: var(--admin-text); border-color: var(--admin-text-secondary); }
        .btn-primary {
            padding: 7px 16px; border-radius: 8px; border: none;
            background: var(--admin-secondary); color: #fff; font-size: 13px;
            font-weight: 500; cursor: pointer;
        }
        .btn-primary:hover { background: #7c3aed; }

        @media (max-width: 768px) {
            .fgrid { grid-template-columns: 1fr; }
            .toolbar { flex-wrap: wrap; }
            .search { flex: 1 1 100%; }
            .tbl { font-size: 12px; }
            .tbl th, .tbl td { padding: 8px 10px; }
        }
    </style>
</head>
<body>
    <!-- Sidebar -->
    <aside class="admin-sidebar" id="sidebar">
        <div class="admin-sidebar-brand">
            <img src="/assets/icons/favicon.png" alt="P" style="width:32px;height:32px;border-radius:8px;">
        </div>
        <nav class="admin-sidebar-nav">
            <a href="/admin/dashboard.html" class="admin-nav-item" data-tooltip="Overview">
                <span class="nav-icon"><i class="fas fa-th-large"></i></span>
                <span class="nav-label">Overview</span>
            </a>
            <a href="/admin/products.html" class="admin-nav-item active" data-tooltip="Products">
                <span class="nav-icon"><i class="fas fa-box"></i></span>
                <span class="nav-label">Products</span>
            </a>
            <a href="/admin/orders.html" class="admin-nav-item" data-tooltip="Orders">
                <span class="nav-icon"><i class="fas fa-shopping-cart"></i></span>
                <span class="nav-label">Orders</span>
            </a>
            <a href="/admin/customers.html" class="admin-nav-item" data-tooltip="Customers">
                <span class="nav-icon"><i class="fas fa-users"></i></span>
                <span class="nav-label">Customers</span>
            </a>
            <a href="/admin/categories.html" class="admin-nav-item" data-tooltip="Categories">
                <span class="nav-icon"><i class="fas fa-tags"></i></span>
                <span class="nav-label">Categories</span>
            </a>
            <a href="/admin/coupons.html" class="admin-nav-item" data-tooltip="Coupons">
                <span class="nav-icon"><i class="fas fa-ticket-alt"></i></span>
                <span class="nav-label">Coupons</span>
            </a>
            <a href="/admin/analytics.html" class="admin-nav-item" data-tooltip="Analytics">
                <span class="nav-icon"><i class="fas fa-chart-bar"></i></span>
                <span class="nav-label">Analytics</span>
            </a>
            <a href="/admin/settings.html" class="admin-nav-item" data-tooltip="Settings">
                <span class="nav-icon"><i class="fas fa-cog"></i></span>
                <span class="nav-label">Settings</span>
            </a>
        </nav>
        <div class="admin-sidebar-footer">
            <a href="/" class="admin-nav-item" data-tooltip="View Store">
                <span class="nav-icon"><i class="fas fa-external-link-alt"></i></span>
                <span class="nav-label">Store</span>
            </a>
            <button class="admin-nav-item" id="logoutBtn" data-tooltip="Logout">
                <span class="nav-icon"><i class="fas fa-sign-out-alt"></i></span>
                <span class="nav-label">Logout</span>
            </button>
        </div>
    </aside>

    <!-- Main -->
    <main class="admin-main">
        <header class="admin-topbar">
            <div class="admin-topbar-left">
                <div class="admin-topbar-breadcrumb">
                    <i class="fas fa-box"></i>
                    <span>Products</span>
                </div>
            </div>
            <div class="admin-topbar-right">
                <button class="admin-topbar-icon" title="Notifications"><i class="fas fa-bell"></i></button>
                <div class="admin-topbar-avatar" id="adminAvatar" title="Admin"><i class="fas fa-user"></i></div>
            </div>
        </header>

        <div class="admin-content">
            <div class="page-head">
                <div>
                    <h1>Products</h1>
                    <div class="page-head-sub" id="productsCount">Loading…</div>
                </div>
                <button class="btn-new" onclick="openProductForm()"><i class="fas fa-plus"></i> New Product</button>
            </div>

            <div class="toolbar">
                <div class="search">
                    <i class="fas fa-search"></i>
                    <input type="text" id="productSearch" placeholder="Search name or SKU…" oninput="filterProducts()">
                </div>
                <select class="select" id="categoryFilter" onchange="filterProducts()">
                    <option value="">All Categories</option>
                </select>
                <select class="select" id="brandFilter" onchange="filterProducts()">
                    <option value="">All Brands</option>
                </select>
            </div>

            <div class="table-wrap">
                <table class="tbl">
                    <thead>
                        <tr>
                            <th style="width:44px;"></th>
                            <th>Product</th>
                            <th>SKU</th>
                            <th>Price</th>
                            <th>Stock</th>
                            <th>Status</th>
                            <th style="text-align:right;">&nbsp;</th>
                        </th>
                    </thead>
                    <tbody id="productsBody">
                        <tr><td colspan="7" class="empty"><i class="fas fa-spinner fa-spin"></i>Loading…</td></tr>
                    </tbody>
                </table>
            </div>

            <div class="pager" id="productsPagination"></div>
        </div>
    </main>

    <!-- Product Form Modal -->
    <div class="modal-overlay" id="productModal">
        <div class="modal">
            <div class="modal-head">
                <h3 id="modalTitle">Add Product</h3>
                <button class="modal-x" onclick="closeProductForm()">&times;</button>
            </div>
            <form id="productForm" onsubmit="saveProduct(event)">
                <div class="modal-body">
                    <input type="hidden" name="id" id="pf-id">
                    <div class="fgrid">
                        <div class="fgroup full"><label class="flabel">Name *</label><input class="fin" name="name" id="pf-name" required></div>
                        <div class="fgroup"><label class="flabel">Category</label><select class="fsel" name="category_id" id="pf-category"></select></div>
                        <div class="fgroup"><label class="flabel">Brand</label><input class="fin" name="brand" id="pf-brand"></div>
                        <div class="fgroup"><label class="flabel">SKU</label><input class="fin" name="sku" id="pf-sku"></div>
                        <div class="fgroup"><label class="flabel">Price *</label><input class="fin" type="number" step="0.01" name="price" id="pf-price" required></div>
                        <div class="fgroup"><label class="flabel">Compare at Price</label><input class="fin" type="number" step="0.01" name="compare_at_price" id="pf-compare"></div>
                        <div class="fgroup"><label class="flabel">Cost Price</label><input class="fin" type="number" step="0.01" name="cost_price" id="pf-cost"></div>
                        <div class="fgroup"><label class="flabel">Stock *</label><input class="fin" type="number" name="stock_quantity" id="pf-stock" required></div>
                        <div class="fgroup"><label class="flabel">Weight (kg)</label><input class="fin" type="number" step="0.01" name="weight" id="pf-weight"></div>
                        <div class="fgroup full"><label class="flabel">Short Description</label><input class="fin" name="short_description" id="pf-short"></div>
                        <div class="fgroup full"><label class="flabel">Description</label><textarea class="fta" name="description" id="pf-desc" rows="4"></textarea></div>
                        <div class="fgroup full" style="flex-direction:row;gap:20px;">
                            <label class="fcheck"><input type="checkbox" name="is_active" id="pf-active" checked> Active</label>
                            <label class="fcheck"><input type="checkbox" name="is_featured" id="pf-featured"> Featured</label>
                            <label class="fcheck"><input type="checkbox" name="track_inventory" id="pf-track" checked> Track Inventory</label>
                        </div>
                    </div>
                </div>
                <div class="modal-foot">
                    <button type="button" class="btn-ghost" onclick="closeProductForm()">Cancel</button>
                    <button type="submit" class="btn-primary" id="pf-submit">Save Product</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/js/all.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="/js/env.js"></script>
    <script src="/js/config.js"></script>
    <script src="/js/supabase.js"></script>
    <script src="/js/admin-guard.js"></script>
    <script>
    (function() {
        'use strict';
        var db = window.db;
        var allProducts = [];
        var filteredProducts = [];
        var categories = [];
        var currentPage = 1;
        var perPage = 20;

        function fmt(v) { return 'AED ' + Number(v||0).toLocaleString('en-AE', {minimumFractionDigits:2, maximumFractionDigits:2}); }
        function esc(s) { var d = document.createElement('div'); d.textContent = s||''; return d.innerHTML; }

        async function loadProducts() {
            var result = await db.from('products').select('*, categories(name)').is('deleted_at', null).order('created_at', {ascending:false});
            if (result.error) { console.error(result.error); return; }
            allProducts = result.data || [];
            // Load primary images for all products
            var ids = allProducts.map(function(p) { return p.id; });
            if (ids.length > 0) {
                var imgResult = await db.from('product_images').select('product_id, url').eq('is_primary', true).in('product_id', ids);
                var imgMap = {};
                if (imgResult.data) imgResult.data.forEach(function(img) { imgMap[img.product_id] = img.url; });
                allProducts.forEach(function(p) { p._imageUrl = imgMap[p.id] || null; });
            }
            filteredProducts = allProducts;
            await loadCategories();
            await loadBrands();
            renderProducts();
        }

        async function loadCategories() {
            var r = await db.from('categories').select('id, name');
            categories = r.data || [];
            var sel = document.getElementById('categoryFilter');
            categories.forEach(function(c) {
                var opt = document.createElement('option');
                opt.value = c.id; opt.textContent = c.name;
                sel.appendChild(opt);
            });
            var pfSel = document.getElementById('pf-category');
            categories.forEach(function(c) {
                var opt = document.createElement('option');
                opt.value = c.id; opt.textContent = c.name;
                pfSel.appendChild(opt);
            });
        }

        async function loadBrands() {
            var brands = {};
            allProducts.forEach(function(p) { if (p.brand) brands[p.brand] = true; });
            var sel = document.getElementById('brandFilter');
            Object.keys(brands).sort().forEach(function(b) {
                var opt = document.createElement('option');
                opt.value = b; opt.textContent = b;
                sel.appendChild(opt);
            });
        }

        window.filterProducts = function() {
            var search = document.getElementById('productSearch').value.toLowerCase();
            var catId = document.getElementById('categoryFilter').value;
            var brand = document.getElementById('brandFilter').value;
            filteredProducts = allProducts.filter(function(p) {
                if (search && !p.name.toLowerCase().includes(search) && !(p.sku||'').toLowerCase().includes(search)) return false;
                if (catId && p.category_id !== catId) return false;
                if (brand && p.brand !== brand) return false;
                return true;
            });
            currentPage = 1;
            renderProducts();
        };

        function renderProducts() {
            var tbody = document.getElementById('productsBody');
            var start = (currentPage - 1) * perPage;
            var page = filteredProducts.slice(start, start + perPage);
            document.getElementById('productsCount').textContent = filteredProducts.length + ' products';

            if (page.length === 0) {
                tbody.innerHTML = '<tr><td colspan="7" class="empty"><i class="fas fa-box-open"></i>No products found</td></tr>';
                document.getElementById('productsPagination').innerHTML = '';
                return;
            }

            tbody.innerHTML = page.map(function(p) {
                var imgUrl = p._imageUrl || '/assets/placeholder-laptop.png';
                if (imgUrl && !imgUrl.startsWith('http')) imgUrl = window.productImageUrl ? window.productImageUrl(imgUrl) : imgUrl;
                var catName = p.categories ? p.categories.name : '';
                var stock = p.stock_quantity || 0;
                var stockClass = stock <= 5 ? 'low' : '';
                return '<tr>' +
                    '<td><img class="p-img" src="' + esc(imgUrl) + '" onerror="this.src=\'/assets/placeholder-laptop.png\'" alt=""></td>' +
                    '<td><div class="p-name">' + esc(p.name) + '</div><div class="p-sub">' + esc(p.brand||'') + (catName ? ' · ' + esc(catName) : '') + '</div></td>' +
                    '<td class="p-sku">' + esc(p.sku||'—') + '</td>' +
                    '<td class="p-price">' + fmt(p.price) + '</td>' +
                    '<td class="p-stock ' + stockClass + '">' + stock + '</td>' +
                    '<td><span class="dot ' + (p.is_active ? 'on' : 'off') + '"></span>' + (p.is_active ? 'Active' : 'Inactive') + '</td>' +
                    '<td><div class="row-actions">' +
                        '<button class="icon-btn" title="Edit" onclick="editProduct(\'' + p.id + '\')"><i class="fas fa-pen"></i></button>' +
                        '<button class="icon-btn danger" title="Delete" onclick="deleteProduct(\'' + p.id + '\', \'' + esc(p.name).replace(/'/g,"\\'") + '\')"><i class="fas fa-trash"></i></button>' +
                    '</div></td></tr>';
            }).join('');

            renderPagination();
        }

        function renderPagination() {
            var total = Math.ceil(filteredProducts.length / perPage);
            var el = document.getElementById('productsPagination');
            if (total <= 1) { el.innerHTML = ''; return; }
            var html = '<button class="pg" onclick="goPage(' + (currentPage-1) + ')" ' + (currentPage<=1?'disabled':'') + '>&laquo;</button>';
            for (var i = 1; i <= total; i++) {
                if (i === 1 || i === total || Math.abs(i - currentPage) <= 2) {
                    html += '<button class="pg ' + (i===currentPage?'active':'') + '" onclick="goPage(' + i + ')">' + i + '</button>';
                } else if (Math.abs(i - currentPage) === 3) {
                    html += '<span class="pg-dots">…</span>';
                }
            }
            html += '<button class="pg" onclick="goPage(' + (currentPage+1) + ')" ' + (currentPage>=total?'disabled':'') + '>&raquo;</button>';
            el.innerHTML = html;
        }

        window.goPage = function(p) {
            var total = Math.ceil(filteredProducts.length / perPage);
            if (p < 1 || p > total) return;
            currentPage = p;
            renderProducts();
        };

        window.openProductForm = function(product) {
            document.getElementById('modalTitle').textContent = product ? 'Edit Product' : 'Add Product';
            document.getElementById('pf-id').value = product ? product.id : '';
            document.getElementById('pf-name').value = product ? product.name : '';
            document.getElementById('pf-category').value = product ? product.category_id : '';
            document.getElementById('pf-brand').value = product ? product.brand : '';
            document.getElementById('pf-sku').value = product ? product.sku : '';
            document.getElementById('pf-price').value = product ? product.price : '';
            document.getElementById('pf-compare').value = product ? product.compare_at_price : '';
            document.getElementById('pf-cost').value = product ? product.cost_price : '';
            document.getElementById('pf-stock').value = product ? product.stock_quantity : '';
            document.getElementById('pf-weight').value = product ? product.weight : '';
            document.getElementById('pf-short').value = product ? product.short_description : '';
            document.getElementById('pf-desc').value = product ? product.description : '';
            document.getElementById('pf-active').checked = product ? product.is_active : true;
            document.getElementById('pf-featured').checked = product ? product.is_featured : false;
            document.getElementById('pf-track').checked = product ? product.track_inventory : true;
            document.getElementById('productModal').classList.add('active');
        };

        window.closeProductForm = function() {
            document.getElementById('productModal').classList.remove('active');
            document.getElementById('productForm').reset();
        };

        window.editProduct = function(id) {
            var p = allProducts.find(function(x) { return x.id === id; });
            if (p) openProductForm(p);
        };

        window.saveProduct = async function(e) {
            e.preventDefault();
            var id = document.getElementById('pf-id').value;
            var data = {
                name: document.getElementById('pf-name').value,
                category_id: document.getElementById('pf-category').value || null,
                brand: document.getElementById('pf-brand').value,
                sku: document.getElementById('pf-sku').value,
                price: parseFloat(document.getElementById('pf-price').value),
                compare_at_price: parseFloat(document.getElementById('pf-compare').value) || null,
                cost_price: parseFloat(document.getElementById('pf-cost').value) || null,
                stock_quantity: parseInt(document.getElementById('pf-stock').value) || 0,
                weight: parseFloat(document.getElementById('pf-weight').value) || null,
                short_description: document.getElementById('pf-short').value,
                description: document.getElementById('pf-desc').value,
                is_active: document.getElementById('pf-active').checked,
                is_featured: document.getElementById('pf-featured').checked,
                track_inventory: document.getElementById('pf-track').checked,
            };
            var result;
            if (id) {
                result = await db.from('products').update(data).eq('id', id);
            } else {
                data.slug = data.name.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/(^-|-$)/g, '');
                result = await db.from('products').insert(data);
            }
            if (result.error) { alert('Error: ' + result.error.message); return; }
            closeProductForm();
            loadProducts();
        };

        window.deleteProduct = async function(id, name) {
            if (!confirm('Delete "' + name + '"? This cannot be undone.')) return;
            var result = await db.from('products').update({ deleted_at: new Date().toISOString() }).eq('id', id);
            if (result.error) { alert('Error: ' + result.error.message); return; }
            loadProducts();
        };

        // Init
        document.addEventListener('DOMContentLoaded', function() {
            document.getElementById('logoutBtn').addEventListener('click', async function() {
                await db.auth.signOut();
                window.location.href = '/pages/login.html';
            });
            requireAdmin(function() { loadProducts(); });
        });
    })();
    </script>
</body>
</html>
