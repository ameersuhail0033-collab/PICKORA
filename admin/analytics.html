<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Analytics — Admin — {{STORE_NAME}}</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" type="image/png" href="/assets/icons/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/main.css">
  <link rel="stylesheet" href="/css/admin.css">
  <script src="/js/env.js"></script><script src="/js/config.js"></script>
</head>
<body>
  <div class="admin-layout">
    <aside class="admin-sidebar" id="admin-sidebar"></aside>
    <main class="admin-main">
      <div class="admin-topbar"><h1>Analytics</h1></div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:1.5rem;">
        <div class="chart-container glass-card">
          <div class="chart-header"><h3>Revenue Trend</h3></div>
          <div class="chart-canvas-wrap"><canvas id="analytics-revenue"></canvas></div>
        </div>
        <div class="chart-container glass-card">
          <div class="chart-header"><h3>Orders Trend</h3></div>
          <div class="chart-canvas-wrap"><canvas id="analytics-orders"></canvas></div>
        </div>
      </div>
      <div class="admin-table-card glass-card" style="margin-top:1.5rem;">
        <div class="admin-table-header"><h3>Top Products by Revenue</h3></div>
        <div class="table-container" style="border:none;border-radius:0;">
          <table class="table"><thead><tr><th>Product</th><th>Sales</th><th>Revenue</th></tr></thead>
          <tbody id="analytics-top-products"><tr><td colspan="3" style="text-align:center;padding:2rem;color:var(--text-muted);">Loading...</td></tr></tbody></table>
        </div>
      </div>
    </main>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/js/env.js"></script><script src="/js/config.js"></script><script src="/js/supabase.js"></script><script src="/js/settings.js"></script><script src="/js/components.js"></script>
  <script src="/js/analytics.js"></script>
  <script>document.addEventListener('DOMContentLoaded',function(){initAdminSidebar('analytics');loadAnalytics();});</script>
</body>
</html>
