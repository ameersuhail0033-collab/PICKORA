<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coupons — Pickora Admin</title>
    <meta name="robots" content="noindex, nofollow">
    <link rel="icon" type="image/png" href="/assets/icons/favicon.png">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/admin.css">
    <style>
        .page-toolbar { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 12px; margin-bottom: 20px; }
        .search-box { display: flex; align-items: center; gap: 8px; background: var(--admin-surface); border: 1px solid var(--admin-border); border-radius: var(--admin-radius); padding: 8px 12px; flex: 1; max-width: 320px; }
        .search-box input { background: none; border: none; color: var(--admin-text); font-size: 13px; outline: none; width: 100%; }
        .search-box input::placeholder { color: var(--admin-text-muted); }
        .search-box i { color: var(--admin-text-muted); font-size: 14px; }
        .btn-add { display: inline-flex; align-items: center; gap: 6px; background: var(--admin-secondary); color: white; border: none; border-radius: var(--admin-radius); padding: 8px 16px; font-size: 13px; font-weight: 500; cursor: pointer; transition: all 0.15s; }
        .btn-add:hover { background: #7c3aed; }
        .data-table { width: 100%; border-collapse: collapse; }
        .data-table th { text-align: left; padding: 12px 16px; font-size: 12px; font-weight: 600; color: var(--admin-text-secondary); text-transform: uppercase; letter-spacing: 0.05em; border-bottom: 1px solid var(--admin-border); }
        .data-table td { padding: 12px 16px; font-size: 13px; color: var(--admin-text-secondary); border-bottom: 1px solid var(--admin-border-light); }
        .data-table tr:hover td { background: var(--admin-surface-hover); }
        .data-table .code { font-family: 'SF Mono', monospace; font-weight: 600; color: var(--admin-text); }
        .data-table .val { font-weight: 600; color: var(--admin-text); font-variant-numeric: tabular-nums; }
        .badge-active { display: inline-block; padding: 3px 10px; border-radius: 20px; font-size: 11px; font-weight: 600; background: rgba(34,197,94,0.12); color: var(--admin-positive); }
        .badge-inactive { display: inline-block; padding: 3px 10px; border-radius: 20px; font-size: 11px; font-weight: 600; background: rgba(239,68,68,0.12); color: var(--admin-negative); }
        .action-btns { display: flex; gap: 6px; }
        .action-btn { width: 32px; height: 32px; border-radius: 6px; border: 1px solid var(--admin-border); background: transparent; color: var(--admin-text-secondary); cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 13px; transition: all 0.15s; }
        .action-btn:hover { background: var(--admin-surface-hover); color: var(--admin-text); border-color: var(--admin-secondary); }
        .action-btn.danger:hover { color: var(--admin-negative); border-color: var(--admin-negative); }
        /* Modal */
        .modal-overlay { position: fixed; inset: 0; z-index: 9000; background: rgba(0,0,0,0.6); backdrop-filter: blur(4px); display: none; align-items: center; justify-content: center; padding: 24px; }
        .modal-overlay.active { display: flex; }
        .modal-box { background: var(--admin-surface); border: 1px solid var(--admin-border); border-radius: var(--admin-radius-lg); width: 100%; max-width: 480px; }
        .modal-header { display: flex; align-items: center; justify-content: space-between; padding: 20px 24px; border-bottom: 1px solid var(--admin-border); }
        .modal-header h3 { font-size: 16px; font-weight: 600; margin: 0; }
        .modal-close { width: 32px; height: 32px; border-radius: 6px; border: none; background: var(--admin-surface-hover); color: var(--admin-text-secondary); cursor: pointer; font-size: 18px; display: flex; align-items: center; justify-content: center; }
        .modal-close:hover { color: var(--admin-text); }
        .modal-body { padding: 24px; }
        .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
        .form-group { display: flex; flex-direction: column; gap: 6px; }
        .form-group.full { grid-column: 1 / -1; }
        .form-label { font-size: 12px; font-weight: 500; color: var(--admin-text-secondary); }
        .form-input, .form-select, .form-textarea { background: var(--admin-bg); border: 1px solid var(--admin-border); border-radius: var(--admin-radius-sm); padding: 10px 12px; color: var(--admin-text); font-size: 13px; outline: none; transition: border-color 0.15s; font-family: inherit; }
        .form-input:focus, .form-select:focus, .form-textarea:focus { border-color: var(--admin-secondary); }
        .form-check { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--admin-text-secondary); cursor: pointer; }
        .form-check input[type="checkbox"] { accent-color: var(--admin-secondary); }
        .modal-footer { display: flex; justify-content: flex-end; gap: 8px; padding: 16px 24px; border-top: 1px solid var(--admin-border); }
        .btn-cancel { padding: 8px 16px; border-radius: var(--admin-radius); border: 1px solid var(--admin-border); background: transparent; color: var(--admin-text-secondary); font-size: 13px; cursor: pointer; transition: all 0.15s; }
        .btn-cancel:hover { border-color: var(--admin-text-secondary); color: var(--admin-text); }
        .btn-save { padding: 8px 20px; border-radius: var(--admin-radius); border: none; background: var(--admin-secondary); color: white; font-size: 13px; font-weight: 500; cursor: pointer; transition: all 0.15s; }
        .btn-save:hover { background: #7c3aed; }
        @media (max-width: 768px) { .form-grid { grid-template-columns: 1fr; } .data-table { font-size: 12px; } .data-table th, .data-table td { padding: 8px 10px; } }
    </style>
</head>
<body>
    <aside class="admin-sidebar" id="sidebar">
        <div class="admin-sidebar-brand">
            <img src="/assets/icons/favicon.png" alt="P" style="width:32px;height:32px;border-radius:8px;">
        </div>
        <nav class="admin-sidebar-nav">
            <a href="/admin/dashboard.html" class="admin-nav-item" data-tooltip="Overview"><span class="nav-icon"><i class="fas fa-th-large"></i></span><span class="nav-label">Overview</span></a>
            <a href="/admin/products.html" class="admin-nav-item" data-tooltip="Products"><span class="nav-icon"><i class="fas fa-box"></i></span><span class="nav-label">Products</span></a>
            <a href="/admin/orders.html" class="admin-nav-item" data-tooltip="Orders"><span class="nav-icon"><i class="fas fa-shopping-cart"></i></span><span class="nav-label">Orders</span></a>
            <a href="/admin/customers.html" class="admin-nav-item" data-tooltip="Customers"><span class="nav-icon"><i class="fas fa-users"></i></span><span class="nav-label">Customers</span></a>
            <a href="/admin/categories.html" class="admin-nav-item" data-tooltip="Categories"><span class="nav-icon"><i class="fas fa-tags"></i></span><span class="nav-label">Categories</span></a>
            <a href="/admin/coupons.html" class="admin-nav-item active" data-tooltip="Coupons"><span class="nav-icon"><i class="fas fa-ticket-alt"></i></span><span class="nav-label">Coupons</span></a>
            <a href="/admin/analytics.html" class="admin-nav-item" data-tooltip="Analytics"><span class="nav-icon"><i class="fas fa-chart-bar"></i></span><span class="nav-label">Analytics</span></a>
            <a href="/admin/settings.html" class="admin-nav-item" data-tooltip="Settings"><span class="nav-icon"><i class="fas fa-cog"></i></span><span class="nav-label">Settings</span></a>
        </nav>
        <div class="admin-sidebar-footer">
            <a href="/" class="admin-nav-item" data-tooltip="View Store"><span class="nav-icon"><i class="fas fa-external-link-alt"></i></span><span class="nav-label">Store</span></a>
            <button class="admin-nav-item" id="logoutBtn" data-tooltip="Logout"><span class="nav-icon"><i class="fas fa-sign-out-alt"></i></span><span class="nav-label">Logout</span></button>
        </div>
    </aside>

    <main class="admin-main">
        <header class="admin-topbar">
            <div class="admin-topbar-left">
                <div class="admin-topbar-breadcrumb"><i class="fas fa-ticket-alt"></i><span>Coupons</span></div>
            </div>
            <div class="admin-topbar-right">
                <button class="admin-topbar-icon" title="Notifications"><i class="fas fa-bell"></i></button>
                <div class="admin-avatar" id="adminAvatar" title="Admin"><i class="fas fa-user"></i></div>
                <button class="btn-add" onclick="openCouponForm()"><i class="fas fa-plus"></i> <span>New Coupon</span></button>
            </div>
        </header>

        <div class="admin-content">
            <div class="page-toolbar">
                <div class="search-box">
                    <i class="fas fa-search"></i>
                    <input type="text" id="couponSearch" placeholder="Search coupons..." oninput="filterCoupons()">
                </div>
            </div>

            <div class="admin-panel">
                <div style="overflow-x:auto;">
                    <table class="data-table">
                        <thead>
                            <tr>
                                <th>Code</th>
                                <th>Type</th>
                                <th>Value</th>
                                <th>Min Order</th>
                                <th>Uses</th>
                                <th>Max Uses</th>
                                <th>Status</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody id="coupons-tbody">
                            <tr><td colspan="8" style="text-align:center;padding:2rem;color:var(--admin-text-muted);"><i class="fas fa-spinner fa-spin"></i> Loading...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>

    <!-- Coupon Form Modal -->
    <div class="modal-overlay" id="coupon-modal">
        <div class="modal-box">
            <div class="modal-header">
                <h3 id="coupon-form-title">Add Coupon</h3>
                <button class="modal-close" onclick="closeCouponForm()">&times;</button>
            </div>
            <form id="coupon-form" onsubmit="saveCoupon(event)">
                <div class="modal-body">
                    <input type="hidden" name="id" id="cpf-id">
                    <div class="form-grid">
                        <div class="form-group full"><label class="form-label">Code *</label><input class="form-input" name="code" id="cpf-code" required style="text-transform:uppercase;font-family:monospace;font-weight:600;"></div>
                        <div class="form-group"><label class="form-label">Discount Type</label><select class="form-select" name="discount_type" id="cpf-type"><option value="percentage">Percentage</option><option value="fixed">Fixed Amount</option></select></div>
                        <div class="form-group"><label class="form-label">Discount Value *</label><input class="form-input" type="number" step="0.01" name="discount_value" id="cpf-value" required></div>
                        <div class="form-group"><label class="form-label">Min Order Amount</label><input class="form-input" type="number" step="0.01" name="min_order" id="cpf-min" value="0"></div>
                        <div class="form-group"><label class="form-label">Max Uses (0 = unlimited)</label><input class="form-input" type="number" name="max_uses" id="cpf-max" value="0"></div>
                        <div class="form-group"><label class="form-label">Expires At</label><input class="form-input" type="datetime-local" name="expires_at" id="cpf-expires"></div>
                        <div class="form-group full"><label class="form-check"><input type="checkbox" name="is_active" id="cpf-active" checked> Active</label></div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn-cancel" onclick="closeCouponForm()">Cancel</button>
                    <button type="submit" class="btn-save">Save Coupon</button>
                </div>
            </form>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/js/all.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="/js/env.js"></script>
    <script src="/js/config.js"></script>
    <script src="/js/supabase.js"></script>
    <script src="/js/admin-guard.js"></script>
    <script>
    (function() {
        'use strict';
        var allCoupons = [];

        function esc(s) { var d = document.createElement('div'); d.textContent = s || ''; return d.innerHTML; }
        function fmt(v) { return 'AED ' + Number(v||0).toLocaleString('en-AE', {minimumFractionDigits:2, maximumFractionDigits:2}); }

        async function loadCoupons() {
            var result = await db.from('coupons').select('*').order('created_at', {ascending: false});
            var tbody = document.getElementById('coupons-tbody');
            if (result.error) { tbody.innerHTML = '<tr><td colspan="8" style="text-align:center;padding:2rem;color:var(--admin-negative);">Error: ' + esc(result.error.message) + '</td></tr>'; return; }
            allCoupons = result.data || [];
            renderCoupons(allCoupons);
        }

        function renderCoupons(coupons) {
            var tbody = document.getElementById('coupons-tbody');
            if (!coupons.length) { tbody.innerHTML = '<tr><td colspan="8" style="text-align:center;padding:2rem;color:var(--admin-text-muted);">No coupons found</td></tr>'; return; }
            tbody.innerHTML = coupons.map(function(c) {
                var val = c.discount_type === 'percentage' ? c.discount_value + '%' : fmt(c.discount_value);
                var badge = c.is_active ? '<span class="badge-active">Active</span>' : '<span class="badge-inactive">Inactive</span>';
                return '<tr><td class="code">' + esc(c.code) + '</td><td>' + esc(c.discount_type) + '</td><td class="val">' + val + '</td><td>' + (c.min_order > 0 ? fmt(c.min_order) : '—') + '</td><td>' + c.used_count + '</td><td>' + (c.max_uses > 0 ? c.max_uses : '∞') + '</td><td>' + badge + '</td><td><div class="action-btns"><button class="action-btn" title="Edit" onclick="editCoupon(\'' + c.id + '\')"><i class="fas fa-pen"></i></button><button class="action-btn danger" title="Delete" onclick="deleteCoupon(\'' + c.id + '\')"><i class="fas fa-trash"></i></button></div></td></tr>';
            }).join('');
        }

        window.filterCoupons = function() {
            var q = document.getElementById('couponSearch').value.toLowerCase();
            renderCoupons(allCoupons.filter(function(c) { return c.code.toLowerCase().includes(q) || c.discount_type.toLowerCase().includes(q); }));
        };

        window.openCouponForm = function(coupon) {
            document.getElementById('coupon-form-title').textContent = coupon ? 'Edit Coupon' : 'New Coupon';
            document.getElementById('cpf-id').value = coupon ? coupon.id : '';
            document.getElementById('cpf-code').value = coupon ? coupon.code : '';
            document.getElementById('cpf-type').value = coupon ? coupon.discount_type : 'percentage';
            document.getElementById('cpf-value').value = coupon ? coupon.discount_value : '';
            document.getElementById('cpf-min').value = coupon ? coupon.min_order : 0;
            document.getElementById('cpf-max').value = coupon ? coupon.max_uses : 0;
            document.getElementById('cpf-expires').value = coupon && coupon.expires_at ? coupon.expires_at.slice(0, 16) : '';
            document.getElementById('cpf-active').checked = coupon ? coupon.is_active : true;
            document.getElementById('coupon-modal').classList.add('active');
        };

        window.closeCouponForm = function() { document.getElementById('coupon-modal').classList.remove('active'); };

        window.editCoupon = async function(id) {
            var r = await db.from('coupons').select('*').eq('id', id).single();
            if (r.data) openCouponForm(r.data);
        };

        window.saveCoupon = async function(e) {
            e.preventDefault();
            var id = document.getElementById('cpf-id').value;
            var data = {
                code: document.getElementById('cpf-code').value.trim().toUpperCase(),
                discount_type: document.getElementById('cpf-type').value,
                discount_value: parseFloat(document.getElementById('cpf-value').value) || 0,
                min_order: parseFloat(document.getElementById('cpf-min').value) || 0,
                max_uses: parseInt(document.getElementById('cpf-max').value) || 0,
                expires_at: document.getElementById('cpf-expires').value || null,
                is_active: document.getElementById('cpf-active').checked,
            };
            var res = id ? await db.from('coupons').update(data).eq('id', id) : await db.from('coupons').insert(data);
            if (res.error) { alert('Error: ' + res.error.message); return; }
            closeCouponForm(); loadCoupons();
        };

        window.deleteCoupon = async function(id) {
            if (!confirm('Delete this coupon?')) return;
            var res = await db.from('coupons').delete().eq('id', id);
            if (res.error) { alert('Error: ' + res.error.message); return; }
            loadCoupons();
        };

        document.addEventListener('DOMContentLoaded', function() {
            document.getElementById('logoutBtn').addEventListener('click', async function() { await db.auth.signOut(); window.location.href = '/pages/login.html'; });
            requireAdmin(function() { loadCoupons(); });
        });
    })();
    </script>
</body>
</html>
